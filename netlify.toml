# Hébergement Netlify — application monopage (SPA)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Valeurs PUBLIQUES (URL du projet et clé « anon ») : elles sont de toute façon
  # visibles dans le navigateur. La sécurité repose sur les règles RLS de la base.
  # Ne jamais mettre ici la clé service_role.
  VITE_SUPABASE_URL = "https://amopbblmejoabauqkiul.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFtb3BiYmxtZWpvYWJhdXFraXVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1MzgwNDEsImV4cCI6MjEwOTExNDA0MX0.p4FIJdGMz1yh5Xd2hUeznk29nvesgJ-AUmMaETAXVPc"
  VITE_APP_URL = "https://sos-mobilite.netlify.app"
  VITE_ENABLE_PHONE_AUTH = "false"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(self), microphone=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
